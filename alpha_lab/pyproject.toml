[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-lab"
version = "0.1.0"
description = "Daily equity research tools with walk-forward backtests, cost models, and experiment tracking"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.2,<4",
    "PyYAML>=6.0,<7",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
parquet = ["pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["alpha_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
